# Required: enforce the supported Node.js version declared in package.json.
# Without this check, dependencies may install on an older Node version and fail later with unclear errors.
engineStrict: true

packages:
  - packages/*

catalog:
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  next: 16.4.5
  # Keep all Payload packages on the same release.
  payload: &payloadVersion 4.0.0-beta.7
  '@payloadcms/db-d1-sqlite': *payloadVersion
  '@payloadcms/drizzle': *payloadVersion
  '@payloadcms/live-preview-react': *payloadVersion
  '@payloadcms/next': *payloadVersion
  '@payloadcms/plugin-form-builder': *payloadVersion
  '@payloadcms/plugin-seo': *payloadVersion
  '@payloadcms/richtext-lexical': *payloadVersion
  '@payloadcms/storage-r2': *payloadVersion
  '@payloadcms/ui': *payloadVersion
  '@payloadcms/sdk': *payloadVersion
  react: &reactVersion 19.3.1
  react-dom: *reactVersion
  typescript: 6.0.3
  vitest: 4.1.12

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@payloadcms/sdk@4.0.0-beta.7'
  - '@payloadcms/db-d1-sqlite@4.0.0-beta.7'
  - '@payloadcms/drizzle@4.0.0-beta.7'
  - '@payloadcms/graphql@4.0.0-beta.7'
  - '@payloadcms/live-preview@4.0.0-beta.7'
  - '@payloadcms/live-preview-react@4.0.0-beta.7'
  - '@payloadcms/next@4.0.0-beta.7'
  - '@payloadcms/plugin-cloud-storage@4.0.0-beta.7'
  - '@payloadcms/plugin-form-builder@4.0.0-beta.7'
  - '@payloadcms/plugin-seo@4.0.0-beta.7'
  - '@payloadcms/richtext-lexical@4.0.0-beta.7'
  - '@payloadcms/storage-r2@4.0.0-beta.7'
  - '@payloadcms/storage-s3@4.0.0-beta.7'
  - '@payloadcms/translations@4.0.0-beta.7'
  - '@payloadcms/ui@4.0.0-beta.7'
  - payload@4.0.0-beta.7
  - '@cloudflare/workerd-darwin-64@1.20261103.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261103.1'
  - '@cloudflare/workerd-linux-64@1.20261103.1'
  - '@cloudflare/workerd-linux-arm64@1.20261103.1'
  - '@cloudflare/workerd-windows-64@1.20261103.1'
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - '@opennextjs/aws@4.1.15'
  - '@opennextjs/cloudflare@1.20.16'
  - eslint-config-next@16.4.5
  - miniflare@5.20261103.0-beta
  - next@16.4.5
  - workerd@1.20261103.1
  - wrangler@4.157.0
