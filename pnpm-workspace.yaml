# Required: enforce the supported Node.js version declared in package.json.
# Without this check, dependencies may install on an older Node version and fail later with unclear errors.
engineStrict: true

packages:
  - packages/*

catalog:
  '@types/node': 24.12.3
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  next: 16.3.3
  # Keep all Payload packages on the same release.
  payload: &payloadVersion 3.88.0
  '@payloadcms/admin-bar': *payloadVersion
  '@payloadcms/db-d1-sqlite': *payloadVersion
  '@payloadcms/live-preview': *payloadVersion
  '@payloadcms/next': *payloadVersion
  '@payloadcms/plugin-form-builder': *payloadVersion
  '@payloadcms/richtext-lexical': *payloadVersion
  '@payloadcms/storage-r2': *payloadVersion
  '@payloadcms/ui': *payloadVersion
  react: &reactVersion 19.2.8
  react-dom: *reactVersion
  typescript: 6.0.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
