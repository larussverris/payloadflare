# Required: enforce the supported Node.js version declared in package.json.
# Without this check, dependencies may install on an older Node version and fail later with unclear errors.
engineStrict: true

packages:
  - packages/*

catalog:
  '@types/node': 24.12.3
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  next: 16.4.2
  # Keep all Payload packages on the same release.
  payload: &payloadVersion 4.0.0-beta.6
  '@payloadcms/db-d1-sqlite': *payloadVersion
  '@payloadcms/drizzle': *payloadVersion
  '@payloadcms/live-preview-react': *payloadVersion
  '@payloadcms/next': *payloadVersion
  '@payloadcms/plugin-form-builder': *payloadVersion
  '@payloadcms/plugin-seo': *payloadVersion
  '@payloadcms/richtext-lexical': *payloadVersion
  '@payloadcms/storage-r2': *payloadVersion
  '@payloadcms/ui': *payloadVersion
  '@payloadcms/sdk': *payloadVersion
  react: &reactVersion 19.2.8
  react-dom: *reactVersion
  typescript: 6.0.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@payloadcms/sdk@4.0.0-beta.6'
  - '@payloadcms/db-d1-sqlite@4.0.0-beta.6'
  - '@payloadcms/drizzle@4.0.0-beta.6'
  - '@payloadcms/graphql@4.0.0-beta.6'
  - '@payloadcms/live-preview@4.0.0-beta.6'
  - '@payloadcms/live-preview-react@4.0.0-beta.6'
  - '@payloadcms/next@4.0.0-beta.6'
  - '@payloadcms/plugin-cloud-storage@4.0.0-beta.6'
  - '@payloadcms/plugin-form-builder@4.0.0-beta.6'
  - '@payloadcms/plugin-seo@4.0.0-beta.6'
  - '@payloadcms/richtext-lexical@4.0.0-beta.6'
  - '@payloadcms/storage-r2@4.0.0-beta.6'
  - '@payloadcms/storage-s3@4.0.0-beta.6'
  - '@payloadcms/translations@4.0.0-beta.6'
  - '@payloadcms/ui@4.0.0-beta.6'
  - payload@4.0.0-beta.6
